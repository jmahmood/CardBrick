[package]
name        = "cardbrick"
version     = "0.1.0"
edition     = "2021"
license     = "GPL-3.0-or-later"
description = "An Anki-compatible flash-card app for the TrimUI Brick"

[dependencies]
# Pure Rust graphics and windowing
macroquad = "0.4"

# Desktop UI (egui)
eframe = { version = "0.30", default-features = true }
egui = "0.30"

# Input handling
evdev = "0.12"
nix = { version = "0.29", features = ["fs"] }

# Font rendering and layout
fontdue = "0.8"
ab_glyph = "0.2"

# Audio (pure Rust)
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }

# Core dependencies
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tl = "0.7"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
rand = "0.8"
rand_distr = "0.4"
dirs = "5.0"
futures = "0.3"

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

# Networking for sync (Sprint 4)
reqwest = { version = "0.11", features = ["json"] }
ring = "0.17.12"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
hex = "0.4"

# mDNS service discovery
mdns = "3.0"
socket2 = "0.5"
futures-util = "0.3"
if-addrs = "0.12"

# Remove web server for embedded version
# tiny_http = "0.12"


[lib]
name = "cardbrick"
path = "src/lib.rs"

[features]
default = []
sim = []
perf = []  # Enable battery-focused performance monitoring

[[bin]]
name = "cardbrick"
path = "src/main.rs"

[[bin]]
name = "sync_client"
path = "src/bin/sync_client.rs"

[[bin]]
name = "sync_ring"
path = "src/bin/sync_ring.rs"

[[bin]]
name = "test_display"
path = "src/test_display.rs"

[[bin]]
name = "test_db"
path = "src/test_db.rs"

[[bin]]
name = "cardbrick-cli"
path = "src/bin/cardbrick_cli.rs"

[[bin]]
name = "cardbrick-desktop"
path = "src/bin/cardbrick_desktop.rs"

[package.metadata.deb]
name = "cardbrick-desktop"
maintainer = "CardBrick Team <cardbrick@example.com>"
copyright = "2025, CardBrick Team <cardbrick@example.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
CardBrick Desktop is a spaced repetition flashcard study application \
for desktop Linux systems. It uses the proven SM-2 algorithm to help \
you learn vocabulary, concepts, and other material efficiently through \
intelligent scheduling of review sessions."""
depends = "$auto"
section = "education"
priority = "optional"
assets = [
    ["target/release/cardbrick-desktop", "usr/bin/", "755"],
    ["assets/desktop/cardbrick-desktop.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/cardbrick-desktop/", "644"],
]
