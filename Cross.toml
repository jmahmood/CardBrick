[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libegl1-mesa-dev:$CROSS_DEB_ARCH libgles2-mesa-dev:$CROSS_DEB_ARCH libgbm-dev:$CROSS_DEB_ARCH libdrm-dev:$CROSS_DEB_ARCH libudev-dev:$CROSS_DEB_ARCH libasound2-dev:$CROSS_DEB_ARCH" 
]
